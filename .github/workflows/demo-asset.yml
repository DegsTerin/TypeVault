name: Generate Demo Asset

on:
  push:
    branches:
      - main
    paths:
      - "tools/Generate-DemoGif.py"
      - ".github/workflows/demo-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-asset-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Generate demo GIF
        run: python tools/Generate-DemoGif.py

      - name: Validate demo GIF
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("docs/images/typevault-demo.gif")
          with Image.open(path) as image:
              assert image.size == (1280, 720), image.size
              assert image.n_frames >= 10, image.n_frames
              assert image.info.get("duration", 0) >= 900, image.info

          assert path.stat().st_size < 10 * 1024 * 1024, path.stat().st_size
          print(f"Validated {path}: {path.stat().st_size} bytes")
          PY

      - name: Commit generated demo asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/typevault-demo.gif
          if git diff --cached --quiet; then
            echo "Demo asset is already up to date."
            exit 0
          fi
          git commit -m "docs: regenerate TypeVault demo GIF"
          git push
